name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: refuse a tag that is not on main or whose check run did not succeed
        run: |
          sha=$GITHUB_SHA
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$VERSION is $sha, which is not on main"
            exit 1
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$sha&event=push&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')
          if [ "$conclusion" != success ]; then
            echo "::error::the check workflow of $sha on main is $conclusion, not success. Tag a main commit whose check run passed"
            exit 1
          fi
      - run: make release-archives VERSION="$VERSION"
      - name: run the linux/amd64 archive
        run: |
          mkdir -p bin/smoke
          tar -xzf "bin/release/cx-$VERSION-linux-amd64.tar.gz" -C bin/smoke
          cxdir="bin/smoke/cx-$VERSION-linux-amd64"
          "$cxdir/bin/cx" --version | grep -F "${VERSION#v}"
          "$cxdir/bin/cx" tests/examples/hello-world.cx | grep -qx "Hello World!"
          "$cxdir/bin/cx" build -o bin/smoke/hello tests/examples/hello-world.cx
          bin/smoke/hello | grep -qx "Hello World!"
      - name: write the release notes
        run: make release-notes VERSION="$VERSION" > bin/release-notes.md
      - name: publish the release
        run: |
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" --notes-file bin/release-notes.md $prerelease bin/release/*.tar.gz bin/release/*.zip bin/release/SHA256SUMS
