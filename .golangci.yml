# The linter set and settings of skycoin/skycoin and skycoin/skywire, with the
# exclusions below for what a compiler and VM do on purpose.
version: "2"
run:
  concurrency: 4
  modules-download-mode: vendor
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: true
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    unparam:
      check-exported: false
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    # Report a rule that no longer matches, so a fixed file leaves the list.
    warn-unused: true
    rules:
      - linters:
          - staticcheck
        text: "QF1003:" # could use tagged switch on errCode (staticcheck)
      - linters:
          - staticcheck
        text: "ST1005:" # error strings should not be capitalized (staticcheck)
      - linters:
          - staticcheck
        text: "QF1001:" # could apply De Morgan's law (staticcheck)
      - linters:
          - staticcheck
        text: "QF1004:" # could use strings.ReplaceAll instead (staticcheck)
      - linters:
          - staticcheck
        text: "QF1012:" # could use fmt.Fprintf instead of WriteString(fmt.Sprintf) (staticcheck)
      # skycoin-cx only. The VM and its opcodes convert between the fixed width
      # CX number types on purpose, and a narrowing conversion keeps the low bits.
      - linters:
          - gosec
        text: "G115:"
      # G104 reports the unchecked errors that errcheck reports.
      - linters:
          - gosec
        text: "G104:"
      # math/rand backs the CX rand opcodes, the token fuzzer and the program
      # generator, none of which make secrets.
      - linters:
          - gosec
        text: "G404:"
      # cx reads the source files, and writes the outputs, that its user names,
      # with the 0755 and 0644 modes that go build uses.
      - linters:
          - gosec
        text: "G(301|304|306):"
      # cx build --target=llvm runs clang, and the CX os.Run opcode runs the
      # command its program gives. Tests run the cx binaries they build.
      - linters:
          - gosec
        text: "G204:"
        path: (_test\.go|t11-cx/build_llvm\.go|t5-cxos/op_os\.go)
      # The string pool and the program text view bytes as strings without a
      # copy, see docs/StringsHotPath.md.
      - linters:
          - gosec
        text: "G103:"
        path: (t2-cx-core-stringpool/|t0-util/program_text|t11-cx/run_heap_test\.go)
      # Lint debt from before golangci-lint ran in CI, one rule per file and
      # linter. Fixing a file removes its rule, and the list only shrinks.
      - path: ^t0-benchmarks/compare_test\.go$
        linters: [errcheck]
      - path: ^t0-benchmarks/digitalroot\.go$
        linters: [unconvert]
      - path: ^t0-cx-core-assert/assert_test\.go$
        linters: [gosec]
      - path: ^t0-cx-core-floatparse/atof\.go$
        linters: [nakedret, staticcheck, unparam]
      - path: ^t0-cx-core-floatparse/floatparse_test\.go$
        linters: [errcheck, misspell]
      - path: ^t0-cx-core-floatparse/uscale\.go$
        linters: [staticcheck]
      - path: ^t0-cx-core-objmodelgen/sites\.go$
        linters: [errcheck, gosec]
      - path: ^t0-cxtestrunner/runner\.go$
        linters: [gosec]
      - path: ^t0-cx-tools-names/main\.go$
        linters: [errcheck, gosec]
      - path: ^t0-cx-tools-strhot/main\.go$
        linters: [errcheck, gosec]
      - path: ^t0-ifacecheck/main\.go$
